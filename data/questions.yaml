- question: How many patients received aspirin for sepsis?
  demo: true
  set: standard
  values:
    aspirin: medication.drugname|admissiondrug.drugname|allergy.allergyname
    sepsis: diagnosis.diagnosisstring|admissiondx.admitdxname|careplangoal.cplgoalvalue
  concepts:
  - patients
  tables:
  - medication
  - diagnosis
  - patient
  sql: |
    SELECT COUNT(DISTINCT p.uniquepid) AS patients
    FROM patient p
    JOIN medication m ON m.patientunitstayid = p.patientunitstayid
    JOIN diagnosis d ON d.patientunitstayid = p.patientunitstayid
    WHERE UPPER(m.drugname) LIKE '%ASPIRIN%' AND LOWER(d.diagnosisstring) LIKE '%sepsis%'
