# Benchmark question set.
#   question  what the analyst types
#   set       standard | analytics | hard
#   values    mentions that must be masked, and the column they resolve to
#   concepts  mentions that name a column rather than a value
#   tables    tables that must reach the prompt
#   sql       optional reference query — when present, accuracy is measured
#             against what it returns rather than against a consensus

- question: How many patients received aspirin?
  demo: true
  set: standard
  values:
    aspirin: medication.drugname|admissiondrug.drugname|allergy.allergyname
  concepts:
  - patients
  tables:
  - medication
  - patient
  sql: |
    SELECT COUNT(DISTINCT p.uniquepid) AS patients
    FROM medication m JOIN patient p ON m.patientunitstayid = p.patientunitstayid
    WHERE UPPER(m.drugname) LIKE '%ASPIRIN%'
