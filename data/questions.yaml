- question: Which Caucasian patients with atrial fibrillation received warfarin?
  demo: true
  set: standard
  values:
    Caucasian: patient.ethnicity
    atrial fibrillation: diagnosis.diagnosisstring|pasthistory.pasthistoryvalue|admissiondx.admitdxname
    warfarin: medication.drugname|admissiondrug.drugname
  concepts:
  - patients
  tables:
  - patient
  - diagnosis
  - medication
  sql: |
    SELECT DISTINCT p.uniquepid
    FROM patient p
    JOIN diagnosis d ON d.patientunitstayid = p.patientunitstayid
    JOIN medication m ON m.patientunitstayid = p.patientunitstayid
    WHERE p.ethnicity = 'Caucasian'
      AND LOWER(d.diagnosisstring) LIKE '%atrial fibrillation%'
      AND UPPER(m.drugname) LIKE '%WARFARIN%'
    ORDER BY p.uniquepid
