- question: What is the most frequently prescribed drug in the Cardiac ICU?
  demo: true
  set: standard
  values:
    Cardiac ICU: patient.unittype
  concepts:
  - prescribed
  - drug
  tables:
  - medication
  - patient
  sql: |
    SELECT m.drugname, COUNT(*) AS prescriptions
    FROM medication m JOIN patient p ON m.patientunitstayid = p.patientunitstayid
    WHERE p.unittype = 'Cardiac ICU' AND m.drugname IS NOT NULL AND TRIM(m.drugname) <> ''
    GROUP BY m.drugname
    ORDER BY prescriptions DESC, m.drugname
    LIMIT 1
