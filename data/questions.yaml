- question: Which patient had the highest APACHE score?
  demo: true
  set: standard
  concepts:
  - patient
  - apache score
  tables:
  - apachepatientresult
  - patient
  sql: |
    SELECT DISTINCT p.uniquepid, a.apachescore
    FROM apachepatientresult a JOIN patient p ON a.patientunitstayid = p.patientunitstayid
    WHERE a.apachescore = (SELECT MAX(apachescore) FROM apachepatientresult)
    ORDER BY p.uniquepid
