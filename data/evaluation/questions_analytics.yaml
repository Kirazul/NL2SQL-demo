# =============================================================================
#  Evaluation set for stage 1 — analytical questions
# =============================================================================
#
#  Why this third set exists
#  -------------------------
#  `questions_standard.yaml` and `questions_hard.yaml` both ask about **content**:
#  a drug, a diagnosis, a lab test. Every question in them has something to mask,
#  so they measured the value path and nothing else.
#
#  The questions an analyst actually types are mostly the other kind. They name a
#  **column** and aggregate over it — "the ten most common diagnosis names", "how
#  many patients per ethnicity", "the most common administration routes". There is
#  no value to mask in any of them, and that is exactly where the pipeline used to
#  fail: the index was asked to resolve a column name, and a fuzzy search over
#  thirty thousand values never comes back empty, so it invented one. The question
#  then came back filtered on a value nobody asked about.
#
#  These questions were written by the analyst using the system, one per table and
#  a few across joins. They are the regression set for `db/catalog.py` and for the
#  column/value arbitration in `pipeline/understand.py`.
#
#  Format
#  ------
#    - question: "..."
#      values:   {mention: expected column}   # must be masked   (usually empty here)
#      concepts: [mentions that name a column, not a content]
#      columns:  {mention: expected column}   # where a concept must point
#      tables:   [tables that must reach the prompt]
# =============================================================================

# --- medication --------------------------------------------------------------
- question: "How many patients received aspirin?"
  values: {aspirin: "medication.drugname|admissiondrug.drugname|allergy.allergyname"}
  concepts: [patients]
  tables: [medication, patient]

- question: "What are the 10 most common drug names in the medication table?"
  concepts: [drug names]
  columns: {drug names: "medication.drugname|admissiondrug.drugname|infusiondrug.drugname|allergy.drugname"}
  tables: [medication]

- question: "What are the most common medication administration routes?"
  concepts: [administration routes, medication administration routes]
  columns: {administration routes: "medication.routeadmin"}
  tables: [medication]

- question: "What are the most common medication frequencies?"
  concepts: [medication frequencies, frequencies]
  columns: {medication frequencies: "medication.frequency"}
  tables: [medication]

# --- lab ---------------------------------------------------------------------
- question: "What are the 10 most frequently recorded laboratory tests?"
  concepts: [laboratory tests]
  columns: {laboratory tests: "lab.labname|lab.labmeasurenamesystem|lab.labresult"}
  tables: [lab]

- question: "How many laboratory records are associated with each patient ICU stay?"
  concepts: [laboratory records, ICU stay]
  columns: {laboratory records: "lab.labname|lab.labresult|lab.labmeasurenamesystem"}
  tables: [lab]

# --- diagnosis ---------------------------------------------------------------
- question: "What are the 10 most common diagnosis names?"
  concepts: [diagnosis names]
  columns: {diagnosis names: "diagnosis.diagnosisstring|diagnosis.icd9code|admissiondx.admitdxname"}
  tables: [diagnosis]

- question: "How many diagnosis records are associated with each patient ICU stay?"
  concepts: [diagnosis records, ICU stay]
  tables: [diagnosis]

# --- patient -----------------------------------------------------------------
- question: "How many patients are admitted to each ICU unit type?"
  concepts: [ICU unit type, unit type]
  tables: [patient]

- question: "What is the average height of patients?"
  concepts: [height, patients]
  tables: [patient]

- question: "How many patients are male and female?"
  values: {male: "patient.gender", female: "patient.gender"}
  concepts: [patients]
  tables: [patient]

- question: "How many patients belong to each ethnicity?"
  concepts: [ethnicity]
  columns: {ethnicity: "patient.ethnicity"}
  tables: [patient]

# --- hospital + patient ------------------------------------------------------
- question: "How many patients are associated with each hospital?"
  concepts: [hospital, patients]
  tables: [patient]

- question: "Which hospital has the most patient ICU stays?"
  concepts: [hospital, ICU stays]
  tables: [patient]

- question: "How many patients are in each hospital region?"
  concepts: [hospital region, region]
  columns: {hospital region: "hospital.region"}
  tables: [hospital]

# --- vitalperiodic -----------------------------------------------------------
- question: "How many periodic vital-sign records are associated with each patient ICU stay?"
  concepts: [vital-sign records, periodic vital-sign records]
  tables: [vitalperiodic]

- question: "How many periodic vital-sign records are in the database?"
  concepts: [vital-sign records, periodic vital-sign records]
  tables: [vitalperiodic]

# --- intakeoutput / nursecharting --------------------------------------------
- question: "How many intake/output records are associated with each patient ICU stay?"
  concepts: [intake/output records]
  tables: [intakeoutput]

- question: "How many nursing charting records are associated with each patient ICU stay?"
  concepts: [nursing charting records]
  columns: {nursing charting records: "nursecharting.nursingchartvalue|nursecharting.nursingchartcelltypecat|nursecharting.nursingchartcelltypevalname|nursecharting.nursingchartcelltypevallabel"}
  tables: [nursecharting]

- question: "Which patients have the largest number of nursing charting records?"
  concepts: [nursing charting records, patients]
  tables: [nursecharting]

# --- joins, which is where schema linking earns its place --------------------
- question: "How many patients received aspirin and have at least one laboratory record?"
  values: {aspirin: "medication.drugname|admissiondrug.drugname|allergy.allergyname"}
  concepts: [laboratory record, patients]
  tables: [medication, lab, patient]

- question: "How many patients have both a diagnosis and a medication record?"
  concepts: [diagnosis, medication record, patients]
  tables: [diagnosis, medication, patient]

- question: "What is the average age of patients who received aspirin?"
  values: {aspirin: "medication.drugname|admissiondrug.drugname|allergy.allergyname"}
  concepts: [age, patients]
  tables: [medication, patient]

- question: "For each hospital, how many unique patients received medication?"
  concepts: [hospital, patients, medication]
  tables: [patient, medication]

- question: "Which hospitals have patients with the highest number of medication records?"
  concepts: [hospitals, medication records]
  tables: [patient, medication]

# --- the lookup that started all this ----------------------------------------
- question: "Give me the vital signs of patient 1234"
  concepts: [vital signs]
  tables: [patient]
