# =============================================================================
#  DETAILED QUESTIONS
# =============================================================================
#  The questions above are almost all global ("how many", "average"). A real
#  analyst also asks about one specific case, crosses several conditions, and
#  compares two populations. Those are harder, and that is exactly what needs
#  measuring.
#
#  The values annotated here come from directly inspecting eICU (the columns
#  `unitadmitsource`, `hospitaldischargelocation`, `unittype`, `region`...), not
#  from a guess.
# =============================================================================

# --- One specific patient, by identifier ------------------------------------
#  A critical case for privacy: a stay identifier is
#  personal. It is classified tier C (never indexed, see docs/03-INDEXING.md),
#  therefore unresolvable — and that is the wanted behaviour: the pipeline must
#  treat it as a quantity, not go looking for it in a text column.
- question: "What medications did patient 141764 receive?"
  values: {}
  concepts: [medications, patient]
  tables: [medication, patient]
  unresolvable: ["141764"]

- question: "List all lab results for stay 143870"
  values: {}
  concepts: [lab results, stay]
  tables: [lab]
  unresolvable: ["143870"]

- question: "What was the diagnosis of patient 002-1039?"
  values: {}
  concepts: [diagnosis, patient]
  tables: [diagnosis, patient]
  unresolvable: ["002-1039"]

