# =============================================================================
#  Evaluation set for stage 1 — "Understand"
# =============================================================================
#
#  What this file measures
#  -----------------------
#  Stage 1 has to turn a question into three things: the business values to mask,
#  the concepts that name columns, and the tables to send to the cloud model.
#  This set annotates the expected answer for each.
#
#  It does NOT measure whether the final SQL is right. It measures whether the
#  question was correctly *understood* before any network call.
#
#  Format
#  ------
#    - question: "..."
#      values:   {expected mention: expected table.column}   # to be masked
#      concepts: [mentions that name a column, not a content]
#      tables:   [tables that must be kept for the prompt]
#
#  The questions are in English: so is the database, and the analyst asks in the
#  language of the data (see docs/01-ARCHITECTURE.md).
#
#  Annotated by hand from eICU's real content. Where several columns are
#  defensible (`medication.drugname` or `admissiondrug.drugname`), the accepted
#  variants are separated by `|`.
# =============================================================================

