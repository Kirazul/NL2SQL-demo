<!doctype html>
<html lang="en" class="h-dvh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>NL2SQL</title>
<meta name="description" content="Ask a database in plain English. The cloud model writes the SQL having seen only the schema and a masked question; execution and answer writing stay local." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2309090b'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h14' stroke='%2334d399' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
<script>
  // Applied before first paint: a theme that arrives with the stylesheet makes
  // the page flash white on a dark screen, which is the one bug everybody sees.
  (function () {
    try {
      var stored = localStorage.getItem("nl2sql-theme");
      document.documentElement.dataset.theme = stored || "dark";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
</head>
<body>

<div class="app">

  <header class="header">
    <div class="header-side">
      <div class="picker">
        <button id="arm-button" class="picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="picker-dot" data-arm="hybrid"></span>
          <span class="picker-name" id="arm-label">Hybrid</span>
          <kbd class="kbd"><span>⌘</span>M</kbd>
        </button>
        <div id="arm-menu" class="picker-menu" role="listbox" hidden></div>
      </div>
    </div>

    <div class="header-side header-end">
      <button id="status" class="status" type="button" title="Backend status">
        <span class="status-dot" data-state="checking"></span>
        <span class="status-text">connecting</span>
      </button>
      <button id="theme" class="icon-button" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" class="icon-sun" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
        <svg viewBox="0 0 24 24" class="icon-moon" aria-hidden="true"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="main">

    <section id="hero" class="hero">
      <h1 class="hero-title">
        <span class="wordmark">NL2SQL</span><span class="wordmark-dash">—</span><span
          id="hero-arm" class="wordmark-arm" data-arm="hybrid">HYBRID</span>
      </h1>
    </section>

    <div id="messages" class="messages" hidden></div>

    <div class="composer-zone">
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <textarea
            id="input"
            class="composer-input"
            rows="1"
            maxlength="500"
            spellcheck="false"
            placeholder="Ask about patients, drugs, labs, diagnoses…"></textarea>

          <div class="composer-row">
            <div class="composer-left">
              <button id="schema-button" class="ghost-button" type="button" title="What is in this database?">
                <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3.2"/><path d="M4.5 6v6c0 1.77 3.36 3.2 7.5 3.2s7.5-1.43 7.5-3.2V6"/><path d="M4.5 12v6c0 1.77 3.36 3.2 7.5 3.2s7.5-1.43 7.5-3.2v-6"/></svg>
              </button>
              <span class="composer-divider"></span>
              <button id="trace-toggle" class="ghost-button is-active" type="button" title="Show the pipeline trace">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h6M14 7h6M4 12h10M18 12h2M4 17h4M12 17h8"/><circle cx="12" cy="7" r="1.9"/><circle cx="16" cy="12" r="1.9"/><circle cx="10" cy="17" r="1.9"/></svg>
              </button>
            </div>

            <div class="composer-right">
              <button id="send" class="send" type="submit" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </form>

      <div id="suggestions" class="suggestions"></div>
      <p id="composer-note" class="composer-note"></p>
    </div>

  </main>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Database">
    <div class="sheet-head">
      <h2 id="sheet-title">The database</h2>
      <button class="icon-button" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
